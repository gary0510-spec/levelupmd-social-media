name: decode-images
on:
  push:
    paths: ['b64/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 files to PNG
        run: |
          mkdir -p images
          shopt -s nullglob
          for f in b64/*.b64; do
            n=$(basename "$f" .b64)
            base64 -d "$f" > "images/$n.png"
            git rm -q "$f"
          done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images
          git diff --cached --quiet || git commit -m "Decode images"
          git pull --rebase -q || true
          git push
